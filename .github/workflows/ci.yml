name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Register the Jupyter kernel used by the notebook test
        run: python -m ipykernel install --user --name python3
      - name: Notebook is in sync with the package
        run: python tools/build_notebook.py --check
      - name: Tests (includes headless execution of the Colab notebook)
        run: python -m pytest -q --durations=10

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build
      - name: Build Debian package without root or runtime dependencies
        run: |
          python tools/build_deb.py
          dpkg-deb --info dist/tensegrity-lm_*.deb
          cd dist
          sha256sum --check tensegrity-lm_*.deb.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tensegrity-distributions
          path: |
            dist/*.deb
            dist/*.sha256
            dist/*.whl
            dist/*.tar.gz
